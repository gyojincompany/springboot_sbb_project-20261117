<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/style.css}">
<script type="text/javascript" th:src="@{/js/test.js}"></script>

<title>thymeleaf 문법 연습</title>
</head>
<body>
	<!-- header -->
	<div th:replace="~{fragments/header :: header}"></div>
	
	
	<main>
		<h1>Thymeleaf 연습 출력</h2>
		<hr>
		<h2>단순 변수값 문자열 출력</h2>
		<h3>이름 : <span th:text="${name}">이름자리</span></h3>
		<h3>나이 : <span th:text="${age}">나이자리</span></h3>
		<h2 th:text=${name}></h2>
		<hr>
		<h2>if 문</h2>
		<p th:if="${age > 20}">성인입니다.</p>
		<p th:if="${age < 20}">미성년자입니다.</p>
		<p th:if="${loginId}">tiger님 로그인 중</p>
		<p th:if="${age >= 20}">성인입니다.</p>
		<p th:unless="${age >= 20}">미성년자입니다.</p>
		<hr>
		<h2>반복문</h2>
		<table border="1">
			<tr>
				<th>번호</td>
				<th>이름</td>
			</tr>
			
			<tr th:each="name, status :${strs}"> 
				<td th:text="${status.count}">번호</td>
				<td><a th:href="@{/question/list}" th:text="${name}">이름</a></td>
			</tr>
			
		</table>
		<hr>
		<h2>이미지 불러오기</h2>
		<img th:src="@{img/rose.jpg}">
		<br>
		<form action="@{/loginok}">
			아이디 : <input type="text" name="userid">
		</form>
	</main>
	
	<!-- footer -->
	<div th:replace="~{fragments/footer :: footer}"></div>
		
</body>
</html>
