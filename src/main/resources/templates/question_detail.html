<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 상세 내용</title>
    <!-- Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container my-5">
        
        <!-- 1. 에러 메시지가 존재하는 경우 (글이 없을 때) -->
        <div th:if="${errMsg != null}" class="alert alert-danger" role="alert">
            <h4 class="alert-heading">⚠️ 오류 발생</h4>
            <p class="mb-0" th:text="${errMsg}">에러 메시지 내용</p>
            <hr>
            <div class="text-end">
                <a th:href="@{/question/list}" class="btn btn-outline-danger btn-sm">목록으로 돌아가기</a>
            </div>
        </div>

        <!-- 2. 에러 메시지가 없을 경우 (정상적으로 글을 조회했을 때) -->
        <div th:unless="${errMsg != null}">
            <!-- 질문 제목 영역 -->
            <h2 class="border-bottom pb-3" th:text="${question.subject}">질문 제목</h2>

            <!-- 작성일시 -->
            <div class="text-muted text-end mb-4">
                <span>작성일시: </span>
                <span th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}">2026-06-07 12:00</span>
            </div>

            <!-- 본문 내용 카드 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="card-text" style="white-space: pre-line;" th:text="${question.content}">
                        질문 내용 본문
                    </div>
                </div>
            </div>

            <!-- 목록으로 돌아가기 버튼 -->
            <div class="text-start">
                <a th:href="@{/question/list}" class="btn btn-secondary">목록으로</a>
            </div>
        </div>

    </div>
</body>
</html>
