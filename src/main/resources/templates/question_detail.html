<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>질문 상세 내용</title>
    <link rel="stylesheet" th:href="@{/css/question-detail.css}">
</head>
<body>
    <div class="page-container">

        <!-- 1. 에러 메시지가 존재하는 경우 (글이 없을 때) -->
        <div th:if="${errMsg != null}" class="alert-box" role="alert">
            <h4 class="alert-title">⚠️ 오류 발생</h4>
            <p class="alert-text" th:text="${errMsg}">에러 메시지 내용</p>
            <div class="alert-actions">
                <a th:href="@{/question/list}" class="btn btn-outline-danger">목록으로 돌아가기</a>
            </div>
        </div>

        <!-- 2. 에러 메시지가 없을 경우 (정상적으로 글을 조회했을 때) -->
        <div th:unless="${errMsg != null}">
            <!-- 질문 제목 영역 -->
            <div class="question-header">
                <h2 class="question-title" th:text="${question.subject}">질문 제목</h2>
            </div>

            <!-- 작성일시 -->
            <div class="question-meta">
                <span>작성일시: </span>
                <span th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}">2026-06-07 12:00</span>
            </div>

            <!-- 본문 내용 카드 -->
            <div class="card">
                <div class="card-body">
                    <div class="question-content" th:text="${question.content}">
                        질문 내용 본문
                    </div>
                </div>
            </div>

            <!-- 답변 목록 영역 -->
            <div class="answer-section">
                <h3 class="answer-section-title">
                    답변 <span th:text="${#lists.size(question.answerList)}">0</span>개
                </h3>

                <!-- 답변이 있을 때 -->
                <div th:if="${!#lists.isEmpty(question.answerList)}">
                    <div class="answer-item" th:each="answer : ${question.answerList}">
                        <div class="answer-content" th:text="${answer.content}">답변 내용</div>
                        <div class="answer-meta">
                            <span>작성일시: </span>
                            <span th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}">2026-06-07 12:30</span>
                        </div>
                    </div>
                </div>

                <!-- 답변이 없을 때 -->
                <div th:if="${#lists.isEmpty(question.answerList)}" class="answer-empty">
                    등록된 답변이 없습니다. 첫 번째 답변을 남겨보세요!
                </div>
            </div>

            <!-- 답변 등록 폼 -->
            <div class="card">
                <div class="card-header">답변 등록</div>
                <div class="card-body">
                    <form th:action="@{|/answer/create/${question.id}|}" method="post">
                        <div class="form-group">
                            <label for="content" class="form-label">답변 내용</label>
                            <textarea id="content"
                                      name="content"
                                      class="form-textarea"
                                      placeholder="답변을 입력하세요."
                                      required></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">답변 등록</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 목록으로 돌아가기 버튼 -->
            <div class="footer-actions">
                <a th:href="@{/question/list}" class="btn btn-secondary">목록으로</a>
            </div>
        </div>

    </div>
</body>
</html>
