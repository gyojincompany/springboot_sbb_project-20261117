<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 목록 게시판</title>
    <!-- 디자인을 위해 Bootstrap 5 CDN을 포함했습니다 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container my-5">
        <h2 class="mb-4">질문 목록</h2>
        
        <table class="table table-hover">
            <thead class="table-dark text-center">
                <tr>
                    <th style="width: 10%;">번호</th>
                    <th style="width: 60%;">제목</th>
                    <th style="width: 30%;">작성일시</th>
                </tr>
            </thead>
            <tbody>
                <!-- 질문 목록이 비어있는 경우 -->
                <tr th:if="${#lists.isEmpty(questionList)}">
                    <td colspan="3" class="text-center py-4 text-muted">
                        등록된 질문이 없습니다.
                    </td>
                </tr>
                
                <!-- 질문 목록을 순회하며 출력 -->
                <tr class="text-center" th:each="question, loop : ${questionList}">
                    <!-- 번호 (1부터 시작하려면 loop.count, 역순이 필요하면 loop.index 등을 활용) -->
                    <td th:text="${loop.count}">1</td>
                    
                    <!-- 제목 (상세보기 링크 포함) -->
                    <td class="text-start">
                        <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}" class="text-decoration-none">제목</a>
                    </td>
                    
                    <!-- 작성일시 (LocalDateTime 타입 포맷팅 예시) -->
                    <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}">2026-06-07 12:00</td>
                </tr>
            </tbody>
        </table>

        <!-- 질문 등록 버튼 -->
        <div class="text-end mt-3">
            <a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
        </div>
    </div>
</body>
</html>
