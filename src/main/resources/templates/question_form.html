<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>질문 등록</title>
    <link rel="stylesheet" th:href="@{/css/question-form.css}">
</head>
<body>
    <div class="page-container">

        <!-- 페이지 제목 -->
        <div class="page-header">
            <h2 class="page-title">질문 등록</h2>
        </div>

        <!-- 단일 에러 메시지(errMsg)가 전달된 경우 -->
        <div th:if="${errMsg != null}" class="validation-alert" role="alert">
            <p class="validation-alert-title">입력값을 확인해 주세요.</p>
            <ul class="validation-alert-list">
                <li th:text="${errMsg}">에러 메시지</li>
            </ul>
        </div>

        <!-- 질문 등록 폼 카드 -->
        <div class="card">
            <div class="card-header">새 질문 작성</div>
            <div class="card-body">
                <!-- Case A: Form 객체(questionForm)와 BindingResult를 사용하는 경우 -->
                <form th:if="${questionForm != null}"
                      th:action="@{/question/create}"
                      th:object="${questionForm}"
                      method="post"
                      novalidate>

                    <!-- 전체 폼 단위 에러(global errors)가 있을 때 표시 -->
                    <div th:if="${#fields.hasGlobalErrors()}" class="validation-alert" role="alert">
                        <p class="validation-alert-title">입력값을 확인해 주세요.</p>
                        <ul class="validation-alert-list">
                            <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">전체 에러</li>
                        </ul>
                    </div>

                    <div class="form-group">
                        <label for="subject" class="form-label">제목</label>
                        <input type="text"
                               id="subject"
                               th:field="*{subject}"
                               th:classappend="${#fields.hasErrors('subject')} ? 'input-error' : ''"
                               class="form-input"
                               placeholder="질문 제목을 입력하세요.">
                        <div th:if="${#fields.hasErrors('subject')}" class="field-error">
                            <span th:each="err : ${#fields.errors('subject')}" th:text="${err}">제목 에러 메시지</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="content" class="form-label">내용</label>
                        <textarea id="content"
                                  th:field="*{content}"
                                  th:classappend="${#fields.hasErrors('content')} ? 'input-error' : ''"
                                  class="form-textarea"
                                  placeholder="질문 내용을 입력하세요."></textarea>
                        <div th:if="${#fields.hasErrors('content')}" class="field-error">
                            <span th:each="err : ${#fields.errors('content')}" th:text="${err}">내용 에러 메시지</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/question/list}" class="btn btn-secondary">목록으로</a>
                        <button type="submit" class="btn btn-primary">질문 등록</button>
                    </div>
                </form>

                <!-- Case B: Form 객체 없이 @RequestParam + Model(errMsg, subject, content)로 처리하는 경우 -->
                <form th:if="${questionForm == null}"
                      th:action="@{/question/create}"
                      method="post"
                      novalidate>

                    <div class="form-group">
                        <label for="subjectPlain" class="form-label">제목</label>
                        <input type="text"
                               id="subjectPlain"
                               name="subject"
                               th:value="${subject}"
                               class="form-input"
                               placeholder="질문 제목을 입력하세요.">
                    </div>

                    <div class="form-group">
                        <label for="contentPlain" class="form-label">내용</label>
                        <textarea id="contentPlain"
                                  name="content"
                                  th:text="${content}"
                                  class="form-textarea"
                                  placeholder="질문 내용을 입력하세요."></textarea>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/question/list}" class="btn btn-secondary">목록으로</a>
                        <button type="submit" class="btn btn-primary">질문 등록</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
